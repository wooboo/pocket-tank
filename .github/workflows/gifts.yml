name: gift-protocol
on:
  push:
    paths: ['common/**', 'tests/**', '.github/workflows/gifts.yml']
  pull_request:
    paths: ['common/**', 'tests/**', '.github/workflows/gifts.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transfer recovery and persistence
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Icommon tests/gift_test.c common/gift.c -o /tmp/gift-test
          /tmp/gift-test
          cc -std=c11 -O1 -g -fsanitize=address,undefined -Icommon tests/progression_gift_test.c common/fish_gift.c common/gift.c common/tank.c common/progression.c common/advisor.c -lm -o /tmp/progression-gift-test
          /tmp/progression-gift-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Icommon tests/fish_gift_test.c common/fish_gift.c common/tank.c common/advisor.c -lm -o /tmp/fish-gift-test
          /tmp/fish-gift-test
          cc -std=c11 -O1 -g -fsanitize=address,undefined -Icommon tests/legacy_ble_save_test.c common/fish_gift.c common/gift.c common/tank.c common/progression.c common/advisor.c -lm -o /tmp/legacy-ble-save-test
          /tmp/legacy-ble-save-test
