name: gift-protocol
on:
  push:
    paths: ['common/**', 'tests/**', 'firmware/host_test/**', 'firmware/main/imu_gravity.h', 'tools/check_fork.sh', 'sim/*port_sim.c', '.github/workflows/gifts.yml']
  pull_request:
    paths: ['common/**', 'tests/**', 'firmware/host_test/**', 'firmware/main/imu_gravity.h', 'tools/check_fork.sh', 'sim/*port_sim.c', '.github/workflows/gifts.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transfers, save migration and motion
        run: tools/check_fork.sh
